name: CI
on: push

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
          bundler-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get -yqq install libpq-dev build-essential libcurl4-openssl-dev
          bundle install --jobs 4 --retry 3

      - name: Run rubocop
        run: rubocop

  tests:
    name: Tests
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
          bundler-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get -yqq install libpq-dev build-essential libcurl4-openssl-dev
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: rspec
